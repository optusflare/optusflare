<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>404 — Lost in space | AstraSpec</title>
<meta name="robots" content="noindex" />
<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@600;700&family=Inter:wght@400;500&display=swap" rel="stylesheet">
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:#05050a;color:#e9e9f2;font-family:'Inter',sans-serif;text-align:center;overflow:hidden;position:relative;}
  canvas{position:fixed;inset:0;z-index:-1;}
  h1{font-family:'Space Grotesk',sans-serif;font-size:clamp(3rem,10vw,6rem);margin:0;
    background:linear-gradient(90deg,#00f3ff,#9d4edd);-webkit-background-clip:text;background-clip:text;color:transparent;}
  p{color:#9797ad;font-size:1.05rem;margin:10px 0 26px;}
  a{display:inline-block;padding:.8em 1.6em;border-radius:999px;border:1px solid rgba(255,255,255,.15);
    background:rgba(255,255,255,.05);color:#e9e9f2;text-decoration:none;font-family:'Space Grotesk',sans-serif;}
  a:hover{border-color:#00f3ff;}
</style>
</head>
<body>
<canvas id="stars"></canvas>
<div>
  <h1>404</h1>
  <p>This page drifted out of orbit. Let's get you back.</p>
  <a href="/">← Return to AstraSpec</a>
</div>
<script>
const c=document.getElementById('stars'),ctx=c.getContext('2d');
function resize(){c.width=innerWidth;c.height=innerHeight;} resize(); addEventListener('resize',resize);
const stars=Array.from({length:180},()=>({x:Math.random(),y:Math.random(),z:Math.random()}));
function draw(){
  ctx.clearRect(0,0,c.width,c.height);
  stars.forEach(s=>{
    s.y+=0.0006+s.z*0.0015;
    if(s.y>1) s.y=0;
    ctx.beginPath(); ctx.arc(s.x*c.width, s.y*c.height, 0.5+s.z*1.5, 0, Math.PI*2);
    ctx.fillStyle=`rgba(255,255,255,${0.2+s.z*0.6})`; ctx.fill();
  });
  requestAnimationFrame(draw);
}
draw();
</script>
</body>
</html>
